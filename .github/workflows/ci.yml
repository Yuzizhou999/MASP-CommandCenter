name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -m unit
      - name: Validate frozen Agent gold
        run: python -m pytest tests/test_agent_eval_suite.py
      - name: Retrieval quality gate
        run: >-
          python -m training.evaluate_knowledge_retrieval
          --output-dir /tmp/masp-retrieval-eval
          --enforce-thresholds

  integration:
    # 在 engine.lock.json 锁定的 MASP 提交上运行受引擎门禁保护的用例。
    # tests/conftest.py 要求该检出的 HEAD 精确等于锁定提交且工作区干净，
    # 否则这些用例会静默跳过——那正是本作业要防止的情况。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read locked engine commit
        id: lock
        run: |
          commit="$(python -c 'import json;print(json.load(open("engine.lock.json"))["commit"])')"
          repo="$(python -c 'import json;print(json.load(open("engine.lock.json"))["repository"])')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "repository=${repo#https://github.com/}" >> "$GITHUB_OUTPUT"
          echo "锁定引擎提交：$commit"
      - name: Checkout locked MASP engine
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.commit }}
          path: .masp-engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify the engine gate is actually satisfied
        env:
          MASP_TEST_ENGINE_ROOT: ${{ github.workspace }}/.masp-engine
        run: python scripts/assert_engine_gate.py
      - name: Integration tests
        env:
          MASP_TEST_ENGINE_ROOT: ${{ github.workspace }}/.masp-engine
        run: python -m pytest -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
