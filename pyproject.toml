[project]
name = "masp-command-center"
version = "0.1.0"
description = "Poli Smart Warehouse Lingshu AI dispatch command center"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "networkx>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "shapely>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
